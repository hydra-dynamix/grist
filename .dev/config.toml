# Project-local devkit configuration for the LDGR Rust workspace.
# CI uses the checked-in .dev/bin/dev binary and runs rust_ci.

default_language = "rust"

[tasks.rust_fmt]
commands = [["cargo", "fmt", "--all"]]

[tasks.rust_fmt_check]
commands = [["cargo", "fmt", "--all", "--", "--check"]]

[tasks.rust_lint]
commands = [["cargo", "clippy", "--workspace", "--all-targets", "--features", "cli"]]

[tasks.rust_type]
commands = [["cargo", "check", "--workspace", "--features", "cli"]]

[tasks.rust_test]
commands = [["cargo", "test", "--workspace", "--features", "cli"]]

[tasks.parser_promotion_minimal]
commands = [["cargo", "test", "--workspace", "--no-default-features", "--test", "parser_promotion_harness"]]

[tasks.schema_drift]
commands = [["cargo", "run", "--example", "schema_codegen", "--features", "ldgr-projection,latex,basin", "--", "--check"]]

[tasks.rust_doc]
commands = [["cargo", "doc", "--workspace", "--no-deps", "--features", "cli"]]

[tasks.rust_build]
commands = [["cargo", "build", "--workspace", "--features", "cli"]]

[tasks.rust_check]
commands = ["rust_fmt_check", "rust_lint", "rust_type", "rust_test", "parser_promotion_minimal", "schema_drift", "rust_doc"]

[tasks.rust_ci]
commands = ["rust_check", "rust_build"]

# Compatibility aliases for generic dev invocations in CI or local shells.
[tasks.fmt]
commands = ["rust_fmt"]

[tasks.lint]
commands = ["rust_lint"]

[tasks.type]
commands = ["rust_type"]

[tasks.test]
commands = ["rust_test"]

[tasks.check]
commands = ["rust_check"]

[tasks.ci]
commands = ["rust_ci"]

[tasks.all_ci]
commands = ["rust_ci"]

[languages.rust]
install = []

[languages.rust.pipelines]
fmt = ["rust_fmt"]
lint = ["rust_lint"]
type = ["rust_type"]
test = ["rust_test"]
check = ["rust_check"]
ci = ["rust_ci"]
fix = ["rust_fmt"]
