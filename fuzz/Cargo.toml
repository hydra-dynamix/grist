[package]
name = "grist-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
grist = { path = "..", features = ["full"] }

[[bin]]
name = "universal_bytes"
path = "fuzz_targets/universal_bytes.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
