[package]
name = "grist"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Typed document, code, repository, and model-output interpretation utilities."
license = "Apache-2.0"
repository = "https://github.com/hydra-dynamix/grist"
homepage = "https://github.com/hydra-dynamix/grist"
readme = "README.md"
exclude = [
    ".dev/**",
    ".github/**",
    "artifacts/**",
    "Cargo.toml.orig",
    "target/**",
]

[features]
default = ["text-publishing", "structured-data", "code", "model-output", "document-graph", "schemas"]
full = [
    "extended-encodings",
    "text-publishing",
    "scholarly",
    "pdf",
    "word-processing",
    "presentations",
    "spreadsheets",
    "structured-data",
    "email-message",
    "notebooks",
    "code",
    "archives",
    "media",
    "model-output",
    "ldgr-projection",
    "document-graph",
    "schemas",
]
cli = ["dep:clap", "full"]

# Independent major format-family gates. Families without a built-in parser in
# 0.1 intentionally add no dependency yet; they reserve stable selection names
# without claiming parser availability.
text-publishing = ["markdown", "restructured-text", "asciidoc", "html", "xml", "epub"]
scholarly = ["latex", "xml", "bibliography"]
pdf = ["dep:flate2"]
word-processing = ["word-ooxml", "odf-word", "rtf"]
presentations = ["presentation-ooxml", "presentation-odf"]
spreadsheets = ["spreadsheet-ooxml", "spreadsheet-odf"]
structured-data = ["csv", "serialization", "structured-binary", "columnar", "sqlite"]
email-message = []
notebooks = ["markdown"]
code = [
    "manifests",
    "rust",
    "python",
    "javascript",
    "typescript",
    "go",
    "java",
    "kotlin",
    "c",
    "cpp",
    "csharp",
    "ruby",
    "php",
    "swift",
    "bash",
    "sql",
    "css",
]
archives = ["dep:zip", "dep:flate2", "dep:tar"]
media = []

# Compatibility and individual-parser gates retained for downstream crates.
basin = ["python", "document-graph"]
document-graph = []
latex = []
bibliography = []
ldgr-projection = ["markdown", "serialization", "schemas"]
markdown = ["dep:pulldown-cmark", "dep:serde_yaml", "dep:toml"]
restructured-text = []
asciidoc = []
html = ["dep:html5ever"]
xml = ["dep:quick-xml"]
epub = ["html", "xml", "dep:zip", "dep:flate2"]
word-ooxml = ["dep:zip", "dep:flate2", "dep:quick-xml"]
presentation-ooxml = ["dep:zip", "dep:flate2", "dep:quick-xml"]
presentation-odf = ["dep:zip", "dep:flate2", "dep:quick-xml"]
spreadsheet-ooxml = ["dep:zip", "dep:flate2", "dep:quick-xml"]
spreadsheet-odf = ["dep:zip", "dep:flate2", "dep:quick-xml"]
odf-word = ["dep:zip", "dep:flate2", "dep:quick-xml"]
rtf = ["dep:encoding_rs"]
csv = ["dep:csv"]
rust = ["dep:tree-sitter", "dep:tree-sitter-rust"]
python = ["dep:tree-sitter", "dep:tree-sitter-python"]
javascript = ["dep:tree-sitter", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript"]
typescript = ["javascript"]
secondary-code = ["dep:tree-sitter"]
go = ["secondary-code", "dep:tree-sitter-go"]
java = ["secondary-code", "dep:tree-sitter-java"]
kotlin = ["secondary-code", "dep:tree-sitter-kotlin"]
c = ["secondary-code", "dep:tree-sitter-c"]
cpp = ["secondary-code", "dep:tree-sitter-cpp"]
csharp = ["secondary-code", "dep:tree-sitter-c-sharp"]
ruby = ["secondary-code", "dep:tree-sitter-ruby"]
php = ["secondary-code", "dep:tree-sitter-php"]
swift = ["secondary-code", "dep:tree-sitter-swift"]
bash = ["secondary-code", "dep:tree-sitter-bash"]
sql = ["secondary-code", "dep:tree-sitter-sequel"]
css = ["secondary-code", "dep:tree-sitter-css"]
manifests = ["dep:quick-xml", "dep:serde_yaml", "dep:toml"]
serialization = ["dep:serde_yaml", "dep:toml", "dep:toml_edit", "dep:unsafe-libyaml", "dep:jsonschema", "xml"]
structured-binary = []
columnar = ["dep:flate2"]
sqlite = []
model-output = ["serialization"]
schemas = ["dep:schemars", "dep:jsonschema"]
extended-encodings = ["dep:encoding_rs"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
csv = { version = "1.3", optional = true }
encoding_rs = { version = "0.8", optional = true }
flate2 = { version = "1.1", optional = true }
globset = "0.4"
html5ever = { version = "0.29.1", optional = true }
ignore = "0.4"
jsonschema = { version = "0.26", optional = true }
pulldown-cmark = { version = "0.12", features = ["serde"], optional = true }
quick-xml = { version = "=0.37.5", optional = true }
schemars = { version = "0.8", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { version = "0.9", optional = true }
sha2 = "0.10"
thiserror = "2"
toml = { version = "0.8", optional = true }
toml_edit = { version = "0.22.27", optional = true, features = ["parse"] }
tree-sitter = { version = "0.25", optional = true }
tree-sitter-bash = { version = "=0.25.1", optional = true }
tree-sitter-c = { version = "=0.24.2", optional = true }
tree-sitter-c-sharp = { version = "=0.23.5", optional = true }
tree-sitter-cpp = { version = "=0.23.4", optional = true }
tree-sitter-css = { version = "=0.25.0", optional = true }
tree-sitter-go = { version = "=0.25.0", optional = true }
tree-sitter-java = { version = "=0.23.5", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tar = { version = "0.4.46", optional = true }
tree-sitter-kotlin = { package = "tree-sitter-kotlin-sg", version = "=0.4.1", optional = true }
tree-sitter-php = { version = "=0.24.2", optional = true }
tree-sitter-ruby = { version = "=0.23.1", optional = true }
tree-sitter-sequel = { version = "=0.3.11", optional = true }
tree-sitter-swift = { version = "=0.7.3", optional = true }
zeroize = "1.8"
unsafe-libyaml = { version = "0.2.11", optional = true }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"], optional = true }

[[bin]]
name = "grist"
path = "src/main.rs"
required-features = ["cli"]
